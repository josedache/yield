apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: yield-ingress
  namespace: zeus  # Replace with your application's namespace
  annotations:
    kubernetes.io/ingress.class: "nginx"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
spec:
  tls:
  - hosts:
    - yieldprodtest.creditdirect.ng
    secretName: zeus-tls-secret  # The name of your TLS secret
  rules:
  - host: yieldprodtest.creditdirect.ng
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: yield-service  # Replace with your service name
            port:
              number: 80  # Replace with your service port
