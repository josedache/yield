name: Trigger Repository Dispatch

on:
  workflow_dispatch:
  push:
    branches:
      - 'prod'

jobs:
  trigger:
    runs-on: ubuntu-latest

    steps:
      - name: Repository Dispatch
        uses: peter-evans/repository-dispatch@v3
        with:
          event-type: trigger-prod-workflow
          token: ${{ secrets.PAT }}